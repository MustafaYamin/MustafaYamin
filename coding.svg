<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="480" height="280" role="img" aria-label="Animated developer coding at a desk" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="280" rx="18" fill="url(#bg)"/>

  <!-- floating symbols -->
  <g font-family="Consolas, Menlo, monospace" font-weight="700" fill="#a371f7">
    <text x="60" y="80" font-size="18">&lt;/&gt;
      <animate attributeName="y" values="90;40" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </text>
    <text x="230" y="70" font-size="16" fill="#3fb950">{ }
      <animate attributeName="y" values="80;30" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="415" y="70" font-size="15" fill="#58a6ff">AI
      <animate attributeName="y" values="75;25" dur="5.5s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="5.5s" begin="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- floor shadow -->
  <ellipse cx="270" cy="258" rx="200" ry="8" fill="#000" opacity="0.35"/>

  <!-- chair -->
  <rect x="108" y="128" width="16" height="92" rx="7" fill="#6e40c9"/>
  <rect x="108" y="206" width="78" height="11" rx="5" fill="#8957e5"/>
  <rect x="143" y="217" width="7" height="28" fill="#30363d"/>
  <rect x="120" y="244" width="54" height="6" rx="3" fill="#30363d"/>

  <!-- desk -->
  <rect x="200" y="210" width="260" height="11" rx="3" fill="#3d444d"/>
  <rect x="212" y="221" width="8" height="34" fill="#30363d"/>
  <rect x="440" y="221" width="8" height="34" fill="#30363d"/>

  <!-- monitor -->
  <ellipse cx="365" cy="140" rx="110" ry="80" fill="url(#glow)"/>
  <rect x="288" y="82" width="156" height="106" rx="9" fill="#0d1117" stroke="#484f58" stroke-width="3"/>
  <rect x="358" y="188" width="14" height="17" fill="#484f58"/>
  <rect x="338" y="204" width="54" height="6" rx="3" fill="#484f58"/>
  <circle cx="300" cy="93" r="2.5" fill="#ff7b72"/>
  <circle cx="309" cy="93" r="2.5" fill="#d29922"/>
  <circle cx="318" cy="93" r="2.5" fill="#3fb950"/>

  <!-- code lines typing -->
  <g>
    <rect x="300" y="104" height="5" rx="2.5" fill="#ff7b72"><animate attributeName="width" values="0;0;46;46;0" keyTimes="0;0.02;0.08;0.92;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="350" y="104" height="5" rx="2.5" fill="#79c0ff"><animate attributeName="width" values="0;0;58;58;0" keyTimes="0;0.08;0.15;0.92;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="312" y="116" height="5" rx="2.5" fill="#d2a8ff"><animate attributeName="width" values="0;0;70;70;0" keyTimes="0;0.15;0.23;0.92;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="312" y="128" height="5" rx="2.5" fill="#7ee787"><animate attributeName="width" values="0;0;40;40;0" keyTimes="0;0.23;0.3;0.92;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="356" y="128" height="5" rx="2.5" fill="#ffa657"><animate attributeName="width" values="0;0;62;62;0" keyTimes="0;0.3;0.38;0.92;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="324" y="140" height="5" rx="2.5" fill="#79c0ff"><animate attributeName="width" values="0;0;84;84;0" keyTimes="0;0.38;0.47;0.92;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="324" y="152" height="5" rx="2.5" fill="#7ee787"><animate attributeName="width" values="0;0;52;52;0" keyTimes="0;0.47;0.55;0.92;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="312" y="164" height="5" rx="2.5" fill="#d2a8ff"><animate attributeName="width" values="0;0;30;30;0" keyTimes="0;0.55;0.62;0.92;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="300" y="176" height="5" rx="2.5" fill="#ff7b72"><animate attributeName="width" values="0;0;14;14;0" keyTimes="0;0.62;0.67;0.92;1" dur="7s" repeatCount="indefinite"/></rect>
    <rect x="318" y="174" width="3" height="9" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/></rect>
  </g>

  <!-- keyboard -->
  <rect x="250" y="203" width="66" height="7" rx="2" fill="#6e7681"/>

  <!-- coffee -->
  <rect x="416" y="192" width="16" height="18" rx="3" fill="#f0883e"/>
  <path d="M432 196 q8 0 8 6 q0 6 -8 6" fill="none" stroke="#f0883e" stroke-width="3"/>
  <g fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round">
    <path d="M421 186 q-4 -6 0 -12 q4 -6 0 -12"><animate attributeName="opacity" values="0;0.8;0" dur="2.5s" repeatCount="indefinite"/></path>
    <path d="M428 186 q-4 -6 0 -12 q4 -6 0 -12"><animate attributeName="opacity" values="0;0.8;0" dur="2.5s" begin="1.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- legs -->
  <g stroke-linecap="round" fill="none">
    <path d="M168 206 L228 206 L232 248" stroke="#1f2937" stroke-width="15"/>
    <path d="M222 252 L246 252" stroke="#e6edf3" stroke-width="8"/>
  </g>

  <!-- back arm -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1 -3;0 0;-1 -2;0 0" dur="0.45s" begin="0.2s" repeatCount="indefinite"/>
    <path d="M168 156 L204 186 L246 200" stroke="#196c2e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="249" cy="200" r="6" fill="#a86b3c"/>
  </g>

  <!-- torso (hoodie) -->
  <path d="M138 150 Q160 128 186 146 L192 206 L134 206 Z" fill="#238636"/>
  <path d="M150 140 Q164 160 180 142" fill="none" stroke="#2ea043" stroke-width="3"/>

  <!-- head -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 166 132;3 166 132;0 166 132" dur="2.4s" repeatCount="indefinite"/>
    <rect x="160" y="124" width="12" height="12" fill="#a86b3c"/>
    <circle cx="168" cy="108" r="21" fill="#c68642"/>
    <path d="M147 106 Q146 82 170 84 Q192 85 190 100 Q178 94 166 98 Q158 104 156 116 Q149 116 147 106 Z" fill="#1b1f24"/>
    <!-- glasses -->
    <rect x="176" y="103" width="13" height="9" rx="3" fill="none" stroke="#e6edf3" stroke-width="2"/>
    <path d="M176 107 L166 106" stroke="#e6edf3" stroke-width="2"/>
    <circle cx="183" cy="107.5" r="1.8" fill="#0d1117"/>
    <path d="M181 119 q4 2 7 -1" stroke="#7a3e1d" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M150 104 Q152 78 176 82" fill="none" stroke="#a371f7" stroke-width="4"/>
    <rect x="145" y="100" width="9" height="15" rx="4" fill="#a371f7"/>
  </g>

  <!-- front arm -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-1 -2;0 0;1 -3;0 0" dur="0.45s" repeatCount="indefinite"/>
    <path d="M176 154 L214 184 L258 198" stroke="#238636" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="261" cy="198" r="6.5" fill="#c68642"/>
  </g>
</svg>
